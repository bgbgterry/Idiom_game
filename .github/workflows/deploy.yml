name: Deploy Idiom_game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Mandatory Checkpoint Verification (20 Levels / 2,000 Questions)
        run: python scripts/verify_checkpoint.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site bundle
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
          cp -r css _site/
          cp -r js _site/
          cp -r data _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
